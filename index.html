<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>頂溪自然科學社｜水與熱的冒險</title><style>
:root{--ink:#173c40;--green:#176557;--cream:#f8f6ef;--line:#d7e0d8}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:system-ui,"Microsoft JhengHei",sans-serif}button{font:inherit;cursor:pointer;color:inherit}button:focus-visible{outline:3px solid #cb720d;outline-offset:4px}button:disabled{cursor:default}header{max-width:1100px;margin:auto;padding:26px 24px;display:flex;justify-content:space-between;align-items:center}.brand{font-weight:850;font-size:21px}.tag{font-size:13px;letter-spacing:2px}main{max-width:1050px;margin:25px auto 55px;padding:0 24px}.eyebrow{font-size:13px;letter-spacing:3px;color:#568278;font-weight:800}h1{font-size:clamp(34px,6vw,64px);line-height:1.18;letter-spacing:-2px;margin:14px 0 20px}h2{font-size:28px;margin:12px 0}p{line-height:1.8}.intro{max-width:660px;color:#58716d}.cards{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-top:35px}.card{background:#e6f0eb;border-radius:24px;padding:30px;position:relative;overflow:hidden;border:1px solid var(--line)}.card.heat{background:#f7e9d9}.number{font-size:12px;font-weight:800;letter-spacing:2px}.art{height:155px;display:flex;align-items:center;justify-content:center}.art svg{height:145px;width:100%}.meta{font-size:13px;color:#58716d}.primary{background:var(--green);color:white;border:0;border-radius:12px;padding:14px 24px;font-weight:750}.card .primary{width:100%;margin-top:16px}.heat .primary{background:#95512b}.ghost{border:1px solid #b6c9c0;border-radius:10px;background:transparent;padding:9px 15px}.toprow{display:flex;justify-content:space-between;align-items:center;gap:12px}.panel{background:white;border:1px solid var(--line);border-radius:24px;padding:30px;margin-top:24px}.progress{height:8px;background:#e6ece7;border-radius:10px;margin:22px 0;overflow:hidden}.progress div{height:100%;background:#278375;transition:width .4s}.scene{background:#edf4f0;border-radius:18px;padding:25px;text-align:center;margin:18px 0}.scene .icon{font-size:55px}.scene h2{margin:8px}.question{font-size:21px;font-weight:750}.options{display:grid;grid-template-columns:1fr 1fr;gap:12px}.option{border:2px solid #dce5dd;border-radius:14px;padding:18px;background:white;text-align:left;min-height:66px}.option:hover:not(:disabled){border-color:#438776;background:#f2f8f4}.option.correct{background:#e3f2e6;border-color:#2e8252}.option.wrong{background:#fff0e8;border-color:#b86538}.feedback{min-height:65px;margin:18px 0;line-height:1.7}.feedback strong{display:block}.actions{display:flex;gap:12px;flex-wrap:wrap}.trail{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}.trail span{font-size:13px;background:#eaf1ec;padding:7px 11px;border-radius:20px}.score{background:#e8f0eb;border-radius:30px;padding:8px 16px;font-weight:800}.result{text-align:center;padding:25px 5px}.bigscore{font-size:68px;font-weight:850;margin:12px}.review{padding:15px 0;border-top:1px solid var(--line);line-height:1.8}footer{max-width:1050px;margin:auto;padding:20px 24px 35px;border-top:1px solid var(--line);font-size:12px;color:#617a71}.hidden{display:none!important}@media(max-width:650px){header{padding:20px}.tag{display:none}.cards,.options{grid-template-columns:1fr}.card,.panel{padding:23px}main{margin-top:12px;padding:0 18px}.art{height:120px}h1{letter-spacing:-1px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body><header><div class="brand">◒ 頂溪自然科學社</div><div class="tag">六年級自然 · 單元一與二</div></header><main id="app"></main><footer>跟著課本概念探索水與熱。免登入、不收集姓名；本次遊戲紀錄只保留在目前頁面。重新整理即可清除。</footer>
<script>
'use strict';
const water=[
{place:'海洋',icon:'🌊',q:'陽光照在海面上，小水滴想進入空氣中。它要經過哪個過程？',choices:['融化','蒸發','凝固'],answer:'蒸發',why:'液態水變成氣態水蒸氣，稱為蒸發。水蒸氣本身是看不見的。',next:'水蒸氣'},
{place:'空氣中',icon:'☀️',q:'水蒸氣上升到較冷的高空，形成許多小水滴。這個過程是？',choices:['蒸散','融化','凝結'],answer:'凝結',why:'水蒸氣遇冷凝結成小水滴；小水滴聚集、飄浮在空中，就可能形成雲。',next:'雲'},
{place:'雲裡',icon:'☁️',q:'雲中的小水滴聚集，變得又大又重後掉到地面，形成什麼？',choices:['雨','霜','水蒸氣'],answer:'雨',why:'小水滴從雲中落下形成雨。雪則是冰晶在落地途中沒有融化。',next:'降雨'},
{place:'地面',icon:'🌧️',q:'這次，小水滴沒有流進河流，而是進入土壤和地層。這叫什麼？',choices:['凝華','滲入','蒸發'],answer:'滲入',why:'降水可以匯集成河流，也可能滲入地層，補充地下水。水循環有許多路徑。',next:'地下水'},
{place:'植物根部',icon:'🌱',q:'植物吸收水分後，水分經植物進入空氣中，這個過程稱為？',choices:['降水','凝固','蒸散'],answer:'蒸散',why:'植物吸水後，水分可經蒸散進入空氣。植物也參與自然界的水循環。',next:'再次回到空氣'},
{place:'回到天空',icon:'🌈',q:'回顧旅程，哪個說法最合理？',choices:['所有雨水都只能流入海洋','水在空氣、地表與地下之間循環','水蒸氣離開海洋後就不會回到地面'],answer:'水在空氣、地表與地下之間循環',why:'水可經蒸發、蒸散、凝結、降水、匯集及滲入，在環境中不斷循環。',next:'完成水循環'}];
const heat=[
{icon:'🥄',q:'金屬湯匙的一端放進熱湯，沒有碰到熱湯的握柄也漸漸變熱。沿湯匙傳熱主要是？',answer:'傳導',why:'熱透過金屬，從較熱的一端傳到較冷的握柄。'},
{icon:'🫖',q:'從水的左下方加熱，受熱的水上升，另一側較冷的水下降。水的循環傳熱主要是？',answer:'對流',why:'熱隨著液體循環流動而傳播，是對流。'},
{icon:'☀️',q:'太陽的熱穿過近乎真空的太空，仍可到達地球。依靠的是？',answer:'輻射',why:'輻射不需要藉助物質，也能在真空中傳播熱。'},
{icon:'🧊',q:'冰敷袋緊貼較暖的皮膚，熱透過接觸傳到冰敷袋，主要是？',answer:'傳導',why:'熱從較暖的皮膚傳向較冷的冰敷袋，並不是「冷」流入皮膚。'},
{icon:'🏠',q:'屋頂通風口讓熱空氣上升排出，較涼的空氣補進來。這種流動傳熱是？',answer:'對流',why:'空氣是氣體，能藉流動帶走熱，屬於對流。'},
{icon:'🛰️',q:'在沒有空氣的真空中，兩個不接觸的物體之間，仍可能以哪種方式傳熱？',answer:'輻射',why:'傳導與對流需要物質；輻射可穿過真空。'},
{icon:'🍳',q:'室溫金屬盤接觸冷凍食物，把熱傳給食物，使接觸處逐漸退冰。主要是？',answer:'傳導',why:'接觸的物體間可傳導熱；金屬盤不是自己產生熱，而是把熱傳給較冷的食物。'},
{icon:'❄️',q:'冷氣吹出的較冷空氣下降，與室內較暖空氣形成循環，主要是？',answer:'對流',why:'冷暖空氣流動、交換位置，促進室內熱的傳播。'},
{icon:'🌳',q:'站在樹蔭下，樹冠擋住陽光直接照射，主要減少哪種傳熱？',answer:'輻射',why:'遮住陽光可減少太陽直接帶來的輻射熱。生活中的傳熱常不只一種。'}];
const app=document.querySelector('#app');let state=null;
const escapeHTML=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function home(){state=null;app.innerHTML=`<div class="eyebrow">LEARN · EXPLORE · PLAY</div><h1>今天，讓好奇心<br>帶你闖一關。</h1><p class="intro">成為一滴水，穿越天空與大地；或化身偵探，找出熱的移動方式。每次選擇，都能學會一點新發現。</p><a href="./champi.html" style="display:block;background:#173c40;color:white;padding:22px 26px;border-radius:18px;text-decoration:none;margin-top:25px"><strong style="font-size:22px">🌀 新任務：薔琵颱風知識測驗 →</strong><br><span style="line-height:2">12 題即時回饋 · 天氣判讀 × 防災挑戰</span></a><div class="cards"><section class="card"><div class="number">MISSION 01 / 單元一</div><div class="art"><svg viewBox="0 0 360 150" aria-hidden="true"><path d="M45 120 Q90 95 130 120 T220 120 T320 120" fill="none" stroke="#94b9ac" stroke-width="3"/><circle cx="275" cy="35" r="24" fill="#e5bd60"/><path d="M176 12 C160 38 125 66 125 94 A51 51 0 0 0 227 94 C227 66 192 38 176 12" fill="#73afa5"/><ellipse cx="160" cy="82" rx="9" ry="16" fill="#bce0d4"/><circle cx="163" cy="101" r="4" fill="#173c40"/><circle cx="191" cy="101" r="4" fill="#173c40"/><path d="M169 114q8 7 16 0" fill="none" stroke="#173c40" stroke-width="3"/></svg></div><h2>水滴旅行記</h2><p>跟著小水滴旅行，用你的選擇串起水循環。</p><div class="meta">6 個任務 · 約 3 分鐘 · 旅程挑戰</div><button class="primary" data-start="water">開始水滴旅行 →</button></section><section class="card heat"><div class="number">MISSION 02 / 單元二</div><div class="art"><svg viewBox="0 0 360 150" aria-hidden="true"><circle cx="165" cy="65" r="45" fill="#f2c586" stroke="#a3653d" stroke-width="7"/><path d="M197 100l37 35" stroke="#a3653d" stroke-width="17" stroke-linecap="round"/><path d="M151 42q-15 12 0 24t0 24m24-48q-15 12 0 24t0 24" stroke="#ba6240" stroke-width="5" fill="none"/><circle cx="270" cy="38" r="7" fill="#dca575"/><circle cx="95" cy="120" r="12" fill="#e5c3a0"/></svg></div><h2>熱能偵探</h2><p>調查生活中的線索，辨識傳導、對流與輻射。</p><div class="meta">9 張線索卡 · 約 5 分鐘 · 分類挑戰</div><button class="primary" data-start="heat">接受偵探任務 →</button></section></div>`;app.querySelectorAll('[data-start]').forEach(b=>b.onclick=()=>start(b.dataset.start));}
function start(type,items){state={type,items:items|| (type==='water'?water:shuffle(heat)),index:0,correct:0,mistakes:[],answered:false};render();}
function render(){const s=state,q=s.items[s.index];s.answered=false;const options=s.type==='water'?shuffle(q.choices):['傳導','對流','輻射'];app.innerHTML=`<div class="toprow"><button class="ghost" id="home">← 遊戲大廳</button><span class="score">已答對 ${s.correct} 題</span></div><section class="panel"><div class="eyebrow">${s.type==='water'?'水滴旅行記':'熱能偵探'} · ${s.index+1} / ${s.items.length}</div><div class="progress" role="progressbar" aria-label="完成進度" aria-valuemin="0" aria-valuemax="${s.items.length}" aria-valuenow="${s.index}"><div style="width:${s.index/s.items.length*100}%"></div></div>${s.type==='water'?`<div class="trail"><span>出發：海洋</span>${s.items.slice(0,s.index).map(x=>`<span>→ ${escapeHTML(x.next)}</span>`).join('')}</div>`:''}<div class="scene"><div class="icon" aria-hidden="true">${q.icon}</div><h2>${s.type==='water'?q.place:'線索 '+(s.index+1)}</h2></div><p class="question" id="question">${q.q}</p><div class="options" role="group" aria-labelledby="question">${options.map((o,i)=>`<button class="option" data-index="${i}">${escapeHTML(o)}</button>`).join('')}</div><div class="feedback" id="feedback" role="status" aria-live="polite">選一個答案，看看你的推理。</div><div class="actions"><button class="primary hidden" id="next">${s.index===s.items.length-1?'查看探險成果':'繼續下一關 →'}</button></div></section>`;document.querySelector('#home').onclick=home;app.querySelectorAll('.option').forEach((b,i)=>b.onclick=()=>answer(options[i],b));document.querySelector('#next').onclick=()=>{if(!s.answered)return;s.index++;s.index<s.items.length?render():finish();};}
function answer(choice,button){const s=state;if(s.answered)return;s.answered=true;const q=s.items[s.index],ok=choice===q.answer;if(ok)s.correct++;else s.mistakes.push(q);app.querySelectorAll('.option').forEach(b=>{b.disabled=true;if(b.textContent===q.answer)b.classList.add('correct');});if(!ok)button.classList.add('wrong');document.querySelector('#feedback').innerHTML=`<strong>${ok?'✓ 推理正確！':'再學會一個概念：正確答案是「'+escapeHTML(q.answer)+'」。'}</strong>${escapeHTML(q.why)}`;document.querySelector('.score').textContent='已答對 '+s.correct+' 題';document.querySelector('#next').classList.remove('hidden');document.querySelector('#next').focus();}
function finish(){const s=state,total=s.items.length,perfect=s.correct===total;app.innerHTML=`<section class="panel"><div class="result"><div class="eyebrow">MISSION COMPLETE</div><div style="font-size:55px" aria-hidden="true">${perfect?'🏅':'🌟'}</div><h1 style="font-size:36px">${perfect?'探索達人，任務完成！':'完成探索，再進步一點！'}</h1><div class="bigscore">${s.correct}<span style="font-size:25px"> / ${total}</span></div><p>答對率 ${Math.round(s.correct/total*100)}% · ${perfect?'每個概念都掌握了。':'讀讀下面的解說，把不熟的地方變成熟悉的知識。'}</p></div>${s.mistakes.map(q=>`<div class="review"><strong>${escapeHTML(q.q)}</strong><br>答案：${escapeHTML(q.answer)}<br>${escapeHTML(q.why)}</div>`).join('')}<div class="actions"><button class="primary" id="again">完整再玩一次</button>${s.mistakes.length?'<button class="ghost" id="retry">重練錯題</button>':''}<button class="ghost" id="home">回到遊戲大廳</button></div></section>`;document.querySelector('#again').onclick=()=>start(s.type);document.querySelector('#home').onclick=home;if(s.mistakes.length)document.querySelector('#retry').onclick=()=>start(s.type,s.mistakes.slice());}
home();
</script></body></html>
