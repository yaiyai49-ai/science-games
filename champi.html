<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>薔琵颱風知識測驗｜頂溪自然科學社</title><style>
:root{--ink:#173c40;--green:#176557;--cream:#f8f6ef;--line:#d7e0d8}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:system-ui,"Microsoft JhengHei",sans-serif}button{font:inherit;cursor:pointer;color:inherit}button:focus-visible{outline:3px solid #cb720d;outline-offset:4px}button:disabled{cursor:default}header{max-width:1100px;margin:auto;padding:26px 24px;display:flex;justify-content:space-between;align-items:center}.brand{font-weight:850;font-size:21px}.tag{font-size:13px;letter-spacing:2px}main{max-width:1050px;margin:25px auto 55px;padding:0 24px}.eyebrow{font-size:13px;letter-spacing:3px;color:#568278;font-weight:800}h1{font-size:clamp(34px,6vw,64px);line-height:1.18;letter-spacing:-2px;margin:14px 0 20px}h2{font-size:28px;margin:12px 0}p{line-height:1.8}.intro{max-width:660px;color:#58716d}.cards{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-top:35px}.card{background:#e6f0eb;border-radius:24px;padding:30px;position:relative;overflow:hidden;border:1px solid var(--line)}.card.heat{background:#f7e9d9}.number{font-size:12px;font-weight:800;letter-spacing:2px}.art{height:155px;display:flex;align-items:center;justify-content:center}.art svg{height:145px;width:100%}.meta{font-size:13px;color:#58716d}.primary{background:var(--green);color:white;border:0;border-radius:12px;padding:14px 24px;font-weight:750}.card .primary{width:100%;margin-top:16px}.heat .primary{background:#95512b}.ghost{border:1px solid #b6c9c0;border-radius:10px;background:transparent;padding:9px 15px}.toprow{display:flex;justify-content:space-between;align-items:center;gap:12px}.panel{background:white;border:1px solid var(--line);border-radius:24px;padding:30px;margin-top:24px}.progress{height:8px;background:#e6ece7;border-radius:10px;margin:22px 0;overflow:hidden}.progress div{height:100%;background:#278375;transition:width .4s}.scene{background:#edf4f0;border-radius:18px;padding:25px;text-align:center;margin:18px 0}.scene .icon{font-size:55px}.scene h2{margin:8px}.question{font-size:21px;font-weight:750}.options{display:grid;grid-template-columns:1fr 1fr;gap:12px}.option{border:2px solid #dce5dd;border-radius:14px;padding:18px;background:white;text-align:left;min-height:66px}.option:hover:not(:disabled){border-color:#438776;background:#f2f8f4}.option.correct{background:#e3f2e6;border-color:#2e8252}.option.wrong{background:#fff0e8;border-color:#b86538}.feedback{min-height:65px;margin:18px 0;line-height:1.7}.feedback strong{display:block}.actions{display:flex;gap:12px;flex-wrap:wrap}.trail{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}.trail span{font-size:13px;background:#eaf1ec;padding:7px 11px;border-radius:20px}.score{background:#e8f0eb;border-radius:30px;padding:8px 16px;font-weight:800}.result{text-align:center;padding:25px 5px}.bigscore{font-size:68px;font-weight:850;margin:12px}.review{padding:15px 0;border-top:1px solid var(--line);line-height:1.8}footer{max-width:1050px;margin:auto;padding:20px 24px 35px;border-top:1px solid var(--line);font-size:12px;color:#617a71}.hidden{display:none!important}@media(max-width:650px){header{padding:20px}.tag{display:none}.cards,.options{grid-template-columns:1fr}.card,.panel{padding:23px}main{margin-top:12px;padding:0 18px}.art{height:120px}h1{letter-spacing:-1px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body><header><div class="brand">◒ 頂溪自然科學社</div><div class="tag">六年級自然 · 颱風特別任務</div></header><main id="app"></main><footer>颱風知識練習，答題即時回饋。免登入、不收集姓名；本次遊戲紀錄只保留在目前頁面。重新整理即可清除。</footer>
<script>
'use strict';
const water=[{"place": "颱風誕生", "icon": "🌀", "q": "薔琵是一個颱風名稱。一般而言，颱風最可能從哪種環境發展？", "choices": ["溫暖潮溼的熱帶海洋低氣壓", "乾燥寒冷的內陸高氣壓", "高山上的積雪"], "answer": "溫暖潮溼的熱帶海洋低氣壓", "why": "溫暖海洋提供水氣與能量，熱帶低氣壓在適當條件下可能發展成颱風。不是所有低氣壓都會成為颱風。", "next": "颱風誕生"}, {"place": "氣壓偵探", "icon": "🔎", "q": "假設一張薔琵示意天氣圖，由外向內的等壓線依序為1008、1004、1000百帕。中心應標什麼？", "choices": ["H，高氣壓中心", "L，低氣壓中心", "無法比較氣壓"], "answer": "L，低氣壓中心", "why": "越接近中心氣壓越低，應標示L；這裡的數值只是練習資料。", "next": "氣壓偵探"}, {"place": "風勢線索", "icon": "💨", "q": "兩區比較距離相同，等壓線間隔也相同，甲區線條比乙區密集。通常哪區風勢較強？", "choices": ["甲區", "乙區", "等壓線與風勢完全無關"], "answer": "甲區", "why": "在相同距離內，等壓線越密，氣壓變化通常越大，風勢也通常越強。", "next": "風勢線索"}, {"place": "強度判讀", "icon": "📊", "q": "依課本：輕度17.2～32.6、中度32.7～50.9、強烈51.0以上（公尺／秒）。假設近中心最大風速為每秒40公尺，屬哪一級？", "choices": ["輕度颱風", "中度颱風", "強烈颱風"], "answer": "中度颱風", "why": "40在32.7～50.9之間，因此是中度。不能只看颱風名稱就決定強度。", "next": "強度判讀"}, {"place": "圖像拼圖", "icon": "🛰️", "q": "想同時了解薔琵附近雲層分布、氣壓高低及鋒面位置，應使用哪些資料？", "choices": ["只有降雨機率表", "只看一張照片", "衛星雲圖與地面天氣圖"], "answer": "衛星雲圖與地面天氣圖", "why": "衛星雲圖看雲層，地面天氣圖看氣壓與鋒面，合併判讀能得到更完整的訊息。", "next": "圖像拼圖"}, {"place": "降雨原理", "icon": "🌧️", "q": "颱風雲中的水蒸氣遇冷形成小水滴，主要是哪種變化？", "choices": ["凝結", "蒸發", "融化"], "answer": "凝結", "why": "氣態水蒸氣遇冷變成液態小水滴稱為凝結。小水滴聚集變大、變重後，可能形成降雨。", "next": "降雨原理"}, {"place": "中心以外", "icon": "🗺️", "q": "有人說：「薔琵中心沒有登陸，所以一定不會有風雨。」哪個判斷合理？", "choices": ["正確，只有中心會下雨", "錯誤，外圍環流也可能帶來風雨", "只要看見太陽就不用注意預報"], "answer": "錯誤，外圍環流也可能帶來風雨", "why": "颱風的影響範圍不只中心。應依氣象署最新警報與所在地預報判斷，不能只看是否登陸。", "next": "中心以外"}, {"place": "出發前", "icon": "🎒", "q": "颱風接近前，哪種做法最合適？", "choices": ["趕快去海邊看大浪", "準備飲水、照明及必要藥品，留意警報", "等停電後才開始準備"], "answer": "準備飲水、照明及必要藥品，留意警報", "why": "事先準備物資、確認聯繫方式及留意官方資訊，可以減少災害造成的影響。", "next": "出發前"}, {"place": "山區任務", "icon": "⛰️", "q": "颱風豪雨期間，山區收到疏散通知，應怎麼做？", "choices": ["配合指示前往指定安全處所", "留在溪邊觀察水位", "到海邊躲避山區大雨"], "answer": "配合指示前往指定安全處所", "why": "山區可能出現崩塌、落石與土石流。應配合主管機關疏散，不要自行轉往海邊或溪流。", "next": "山區任務"}, {"place": "訊息查核", "icon": "📱", "q": "群組轉傳一張沒有日期的薔琵路徑圖，最適合怎麼處理？", "choices": ["直接當作最新預報轉傳", "確認發布時間與來源，查官方最新資訊", "轉傳的人很多就一定正確"], "answer": "確認發布時間與來源，查官方最新資訊", "why": "同名颱風可能出現在不同年份；預報也會更新。先確認年份、發布時間與來源，避免誤用舊資料。", "next": "訊息查核"}, {"place": "警報解除", "icon": "🌊", "q": "颱風警報解除後，是否就適合立刻去海邊觀浪？", "choices": ["是，解除警報就完全沒有風浪", "否，仍應留意海象與管制資訊", "只要多人一起去就安全"], "answer": "否，仍應留意海象與管制資訊", "why": "警報解除不代表所有危險立即消失。仍須注意長浪、道路與環境安全，以及現地管制。", "next": "警報解除"}, {"place": "水資源思考", "icon": "💧", "q": "關於颱風帶來的雨水，哪個說法較完整？", "choices": ["只會造成災害，沒有其他影響", "可能補充水資源，也可能造成淹水與土石流", "只要水庫缺水，任何颱風都值得歡迎"], "answer": "可能補充水資源，也可能造成淹水與土石流", "why": "颱風降雨可補充水庫，但強風豪雨也可能致災。認識水資源效益，同時仍要做好防災。", "next": "水資源思考"}];
const heat=[];
const app=document.querySelector('#app');let state=null;
const escapeHTML=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function home(){state=null;app.innerHTML=`<div class="eyebrow" style="font-size:20px;letter-spacing:1px">頂溪國小 防颱知識大挑戰</div><h1>薔琵颱風<br>知識測驗</h1><p class="intro">當一次小小氣象員：讀懂風雨線索、破解迷思，做出安全的選擇。答題後，立即看解說。</p><section class="panel"><div style="font-size:70px" aria-hidden="true">🌀</div><h2>12 個任務，掌握颱風知識</h2><p>不限時 · 答題立即回饋 · 完成後可重練錯題</p><p><strong>本頁是學習測驗，不是即時氣象預報。</strong><br>題目中的風速、氣壓及情境為練習用假設資料，不代表薔琵的實際現況。</p><div class="actions"><button class="primary" id="begin">開始挑戰 →</button><a class="ghost" href="./index.html">回遊戲大廳</a></div></section><p class="meta">學習參考：六上自然課本颱風單元、<a href="https://www.cwa.gov.tw/V8/C/K/Encyclopedia/typhoon/typhoon.pdf" target="_blank" rel="noopener">中央氣象署《颱風百問》</a>。實際天氣請查<a href="https://www.cwa.gov.tw/" target="_blank" rel="noopener">中央氣象署</a>。</p>`;document.querySelector('#begin').onclick=()=>start('water');}
function start(type,items){state={type,items:items|| (type==='water'?water:shuffle(heat)),index:0,correct:0,mistakes:[],answered:false};render();}
function render(){const s=state,q=s.items[s.index];s.answered=false;const options=s.type==='water'?shuffle(q.choices):['傳導','對流','輻射'];app.innerHTML=`<div class="toprow"><button class="ghost" id="home">← 遊戲大廳</button><span class="score">已答對 ${s.correct} 題</span></div><section class="panel"><div class="eyebrow">${s.type==='water'?'薔琵颱風知識測驗':'熱能偵探'} · ${s.index+1} / ${s.items.length}</div><div class="progress" role="progressbar" aria-label="完成進度" aria-valuemin="0" aria-valuemax="${s.items.length}" aria-valuenow="${s.index}"><div style="width:${s.index/s.items.length*100}%"></div></div><div class="scene"><div class="icon" aria-hidden="true">${q.icon}</div><h2>${s.type==='water'?q.place:'線索 '+(s.index+1)}</h2></div><p class="question" id="question">${q.q}</p><div class="options" role="group" aria-labelledby="question">${options.map((o,i)=>`<button class="option" data-index="${i}">${escapeHTML(o)}</button>`).join('')}</div><div class="feedback" id="feedback" role="status" aria-live="polite">選一個答案，看看你的推理。</div><div class="actions"><button class="primary hidden" id="next">${s.index===s.items.length-1?'查看探險成果':'繼續下一關 →'}</button></div></section>`;document.querySelector('#home').onclick=home;app.querySelectorAll('.option').forEach((b,i)=>b.onclick=()=>answer(options[i],b));document.querySelector('#next').onclick=()=>{if(!s.answered)return;s.index++;s.index<s.items.length?render():finish();};}
function answer(choice,button){const s=state;if(s.answered)return;s.answered=true;const q=s.items[s.index],ok=choice===q.answer;if(ok)s.correct++;else s.mistakes.push(q);app.querySelectorAll('.option').forEach(b=>{b.disabled=true;if(b.textContent===q.answer)b.classList.add('correct');});if(!ok)button.classList.add('wrong');document.querySelector('#feedback').innerHTML=`<strong>${ok?'✓ 推理正確！':'再學會一個概念：正確答案是「'+escapeHTML(q.answer)+'」。'}</strong>${escapeHTML(q.why)}`;document.querySelector('.score').textContent='已答對 '+s.correct+' 題';document.querySelector('#next').classList.remove('hidden');document.querySelector('#next').focus();}
function finish(){const s=state,total=s.items.length,perfect=s.correct===total;app.innerHTML=`<section class="panel"><div class="result"><div class="eyebrow">MISSION COMPLETE</div><div style="font-size:55px" aria-hidden="true">${perfect?'🏅':'🌟'}</div><h1 style="font-size:36px">${perfect?'探索達人，任務完成！':'完成探索，再進步一點！'}</h1><div class="bigscore">${s.correct}<span style="font-size:25px"> / ${total}</span></div><p>答對率 ${Math.round(s.correct/total*100)}% · ${perfect?'每個概念都掌握了。':'讀讀下面的解說，把不熟的地方變成熟悉的知識。'}</p></div>${s.mistakes.map(q=>`<div class="review"><strong>${escapeHTML(q.q)}</strong><br>答案：${escapeHTML(q.answer)}<br>${escapeHTML(q.why)}</div>`).join('')}<div class="actions"><button class="primary" id="again">完整再玩一次</button>${s.mistakes.length?'<button class="ghost" id="retry">重練錯題</button>':''}<button class="ghost" id="home">回到遊戲大廳</button></div></section>`;document.querySelector('#again').onclick=()=>start(s.type);document.querySelector('#home').onclick=home;if(s.mistakes.length)document.querySelector('#retry').onclick=()=>start(s.type,s.mistakes.slice());}
home();
</script></body></html>
